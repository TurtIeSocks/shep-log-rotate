# release-plz owns the changelog, the version bump, the tag, the GitHub
# release and the upload.
#
# ## This used to be split, and the split was wrong
#
# Until 2026-08-26 this ran `release-pr` only, and a hand-written
# .github/workflows/release.yml published behind a `v*` tag. The reason given
# was that publishing cannot be undone and a push to main is an easier bar to
# clear by accident than a tag.
#
# That has the risk backwards. Publishing under the standard setup means
# merging a pull request TITLED "chore: release vX.Y.Z", which is a reviewed,
# named, visible artifact. Pushing a tag is a command someone types.
#
# shep hit the consequence the same day this was written: its release PR was
# merged, nothing published, and main sat a version ahead of crates.io waiting
# on a step nobody knew was missing. This repository had the identical split
# and would have surprised its first releaser the same way.
#
# The `crates-io` environment survives the move, so a required reviewer can
# still be added there if this ever wants a human gate.

# ## Two things specific to this crate
#
# It cannot publish at all until `shep-client` is on crates.io. The dependency
# carries a version alongside its git URL so packaging works, but the registry
# refuses an upload whose dependency is not on the index. shep first, then
# this.
#
# And this crate is on a pre-release version. release-plz publishes one fine
# and marks it as such on GitHub, but it has no automated path from
# `-alpha.1` to `-alpha.2` to `-beta.0` to stable; the maintainer said so in
# discussion #2443. So for now the version is set by hand and the release PR
# is a changelog PR.

[workspace]
# Marks a GitHub release as a pre-release when the version carries a SemVer
# pre-release tag. 0.1.0 does not, so this is inert today; it is kept for the
# next time a version does.
git_release_type = "auto"

# No `[[package]]` sections: one crate, nothing to group or exclude.
