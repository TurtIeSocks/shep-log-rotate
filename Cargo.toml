[package]
name = "shep-log-rotate"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
description = "A log-rotation dog for shep: renames grown logs, asks the shepherd to reopen, then compresses and prunes"
repository = "https://github.com/shep-pm/shep-log-rotate"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shep", "process-manager", "logrotate", "logging"]
categories = ["command-line-utilities"]

[features]
# The tier that drives a REAL shepherd. Off by default because it needs a
# `shep` binary, which a fresh clone does not have. See tests/integration.rs.
integration = []

[dependencies]
# Version AND git, deliberately, until shep is on crates.io.
#
# Cargo uses the git source to build, so this tracks shep's main the way it
# has all along. But `cargo package` refuses a dependency with no version
# requirement, so without the version this crate cannot be published at all,
# and finding that out on publish day is the wrong time.
#
# Published 2026-08-26, so the git and branch keys are gone and this resolves
# from the registry. The lockfile is what proves which source was used.
#
# The floor is 0.1.23 because that is the first release carrying
# `ReconnectingClient::connect_as_dog`, and below it there is no public way
# to put a name in the Hello frame. shep marks a dog as having handshaken
# only when the frame names one, so a dog built against an older client
# serves every request correctly and is still rendered `silent`, restarted
# once, and then declared stale. See the module docs in src/main.rs.
shep-client = "0.1.23"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "signal"] }
toml = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# `test-support` only, and only so `Live`'s redacted `Debug` can be proven
# against a real `ReconnectingClient` rather than asserted in a comment. The
# feature gates shep-client's own `testing` module, which binds a fake
# shepherd this crate can connect to. Nothing in the shipped binary sees it.
shep-client = { version = "0.1.23", features = ["test-support"] }

[[test]]
name = "integration"
required-features = ["integration"]

# The same profile settings shep itself carries, for the same reasons.
#
# Debug info dominates a debug build, and a dependency's is never what is
# being debugged. Measured 2026-09-03, clean `cargo test --no-run`:
#
#   target/debug   562 MiB   before
#   target/debug   348 MiB   after
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size, not speed. shep measured thin LTO with one codegen unit at a quarter
# off its binary and nothing measurable off its runtime, and this crate's
# only hot loop is flate2's, which a 64 MiB gzip run timed the same either
# way on 2026-09-03: 190 to 255 MiB/s in both builds, the spread all noise.
# Fat LTO buys another megabyte for another half minute of build, which
# `cargo install` pays on every upgrade. Measured the same day, clean
# `cargo build --release`:
#
#   shep-log-rotate   2,515,168 bytes   before
#   shep-log-rotate   2,012,672 bytes   after
#
# Not `strip`, and not `panic = "abort"`, for shep's reasons: symbols are
# what a profiler names frames with, and `shep-client` re-raises a panicked
# task with `resume_unwind`, which needs a runtime that unwinds.
[profile.release]
lto = "thin"
codegen-units = 1
