name: release
# Publishes this crate to crates.io when a `v*` tag is pushed.
#
# Publishing cannot be undone. A version can be yanked, which hides it from
# new resolutions, but it can never be replaced, and the name-and-version pair
# is spent forever. So the checks below all run before the upload.
#
# One thing to know before tagging: this crate cannot publish until
# `shep-client` is on crates.io. Its dependency carries both a version and a
# git URL, so cargo builds from git while `cargo package` still finds the
# version requirement it demands, but the registry will refuse an upload whose
# dependency is not there. The publish order across the two repositories is
# shep first, then this. See shep's docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  publish:
    runs-on: ubuntu-latest
    # Set this environment up with a required reviewer if you want a human
    # gate between pushing a tag and spending a version number.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal

      - name: The tag and the manifest must agree
        # A tag on the wrong commit, or a bump that never reached Cargo.toml,
        # publishes contents that are not what the tag says. Not recoverable,
        # and not visible in a green test run.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest" >&2
            exit 1
          fi

      - name: The suite, on the exact commit being published
        run: cargo test --locked

      - name: Prove it against a real shepherd
        # The integration tier, which is the only thing here that tests what
        # this crate is for. Publishing a dog that cannot talk to a shepherd
        # is the failure worth spending three minutes to avoid.
        run: |
          cargo install --git https://github.com/TurtIeSocks/shep --branch main --bin shep --locked
          SHEP_BIN="$(command -v shep)" cargo test --features integration --locked

      - name: Rehearse the upload
        run: cargo publish --dry-run --locked

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
