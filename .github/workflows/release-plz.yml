name: release-plz
# Opens and maintains a release pull request: the version bump and the
# changelog, written from the conventional commits since the last release.
#
# It does NOT publish. The `release-plz-release` job from release-plz's
# quickstart is deliberately absent, because `.github/workflows/release.yml`
# owns the upload behind a `v*` tag. Adding it here without deleting that file
# means two workflows racing to publish the same version. See release-plz.toml.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # release-plz reads the commits since the last release tag, so a
          # shallow clone gives it nothing to write a changelog from.
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - uses: release-plz/action@v0
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          # Read-only here: `release-pr` does not upload, but release-plz uses
          # the registry to work out which versions are already published.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
